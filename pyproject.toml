[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meaning-fs"
version = "0.1.1"
description = "Semantic File Index for AI Agents"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Rodrigo Pires", email = "rneto.pires@gmail.com"}
]
keywords = ["ai", "context", "semantic", "index", "agents", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
]

[project.scripts]
meaning = "meaning.meaning_core:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/bozaah/meaning-fs"
Documentation = "https://github.com/bozaah/meaning-fs#readme"
Repository = "https://github.com/bozaah/meaning-fs"

[tool.setuptools.package-data]
meaning = [
    "templates/**/*.yaml",
    "templates/**/*.json",
    "templates/**/*.sh",
    "templates/**/*.md"
]
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = false
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "meaning.meaning_core"
# CLI main() reuses variable names for different types; relax checking
disable_error_code = ["assignment", "arg-type", "attr-defined", "var-annotated"]
